name: Turbo-Lean CAS Cache & Shard Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-lean/**'
      - 'Verity/**'
      - 'Verity.lean'
      - 'Compiler/**'
      - 'Compiler.lean'
      - 'scripts/solidity_differential/**'
      - 'scripts/keccak256.py'
      - 'scripts/setup_solc_import.py'
      - 'Contracts/**'
      - 'Contracts.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/turbo-lean-cache.yml'
  pull_request:
    paths:
      - '.github/actions/setup-lean/**'
      - 'Verity/**'
      - 'Verity.lean'
      - 'Compiler/**'
      - 'Compiler.lean'
      - 'scripts/solidity_differential/**'
      - 'scripts/keccak256.py'
      - 'scripts/setup_solc_import.py'
      - 'Contracts/**'
      - 'Contracts.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/turbo-lean-cache.yml'
  workflow_dispatch:
    inputs:
      check_file:
        description: 'Optional .lean file for fast theorem-shard check (e.g. Verity/Core/Uint256.lean)'
        required: false
        default: 'Verity/Core/Uint256.lean'
        type: string
      check_decl:
        description: 'Optional declaration for single-shard check (e.g. Verity.Core.Uint256.add_comm)'
        required: false
        default: 'Verity.Core.Uint256.add_comm'
        type: string

permissions:
  contents: read

concurrency:
  group: turbo-lean-cache-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERIFY_CACHE_BUCKET: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref_name) }}
  VERIFY_MAIN_CACHE_BUCKET: ref-main
  TURBO_LEAN_COMMIT: 1949eaac9d790d1dd13e357d45aad010fa0be644 # established proof verifier

jobs:
  turbo-lean-verify:
    name: Turbo-Lean Two-Level CAS & Theorem Shard Check
    runs-on: ${{ fromJSON(github.repository == 'kbak/verity' && '["ubuntu-24.04"]' || '["blacksmith-16vcpu-ubuntu-2404"]') }}
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: ${{ github.repository == 'kbak/verity' && '2' || '16' }}
      # CI only needs verdicts; keep turbo-lean from spooling telemetry under ~/.cache.
      TURBO_LEAN_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Materialize reused checkout
        shell: bash
        run: |
          git sparse-checkout disable
          git reset --hard HEAD

      - name: Setup Lean
        uses: ./.github/actions/setup-lean
        with:
          cache-key-prefix: turbo-lean
          use-sticky-disks: ${{ github.repository != 'kbak/verity' }}
          sticky-disk-key-prefix: turbo-lean
          # Same packages tree as verify.yml's proof jobs (no LEAN_CC): share one host copy.
          lake-packages-sticky-key: lake-packages-verify-${{ env.VERIFY_CACHE_BUCKET }}-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean') }}-${{ hashFiles('lake-manifest.json') }}
          lake-packages-main-fallback-sticky-key: ${{ github.event_name == 'pull_request' && format('lake-packages-verify-{0}-{1}-{2}-{3}-{4}', env.VERIFY_MAIN_CACHE_BUCKET, runner.os, hashFiles('lean-toolchain'), hashFiles('lakefile.lean'), hashFiles('lake-manifest.json')) || '' }}
          use-build-sticky-disk: ${{ github.repository != 'kbak/verity' }}
          build-sticky-disk-key: turbo-lean-build-${{ env.VERIFY_CACHE_BUCKET }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean') }}-${{ hashFiles('lake-manifest.json') }}
          build-main-fallback-sticky-key: ${{ github.event_name == 'pull_request' && format('turbo-lean-build-{0}-{1}-{2}-{3}-{4}-{5}', env.VERIFY_MAIN_CACHE_BUCKET, runner.os, runner.arch, hashFiles('lean-toolchain'), hashFiles('lakefile.lean'), hashFiles('lake-manifest.json')) || '' }}
          disable-lake-cache-restore: ${{ github.repository != 'kbak/verity' }}

      - name: Run turbo-lean CAS Import, Shard Check & GDSF GC
        uses: Th0rgal/turbo-lean@1949eaac9d790d1dd13e357d45aad010fa0be644 # established proof verifier
        with:
          project-dir: "."
          command: "check"
          check-file: ${{ inputs.check_file || 'Verity/Core/Uint256.lean' }}
          check-decl: ${{ inputs.check_decl || 'Verity.Core.Uint256.add_comm' }}
          cache-key-prefix: verity-turbo-lean-cas-${{ env.VERIFY_CACHE_BUCKET }}
          max-reclaimable-bytes: "10737418240"

      - name: Run turbo-lean audit-spec, seed-shards, Stdlib Directory Check, pr-verify & verify-receipt
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_REF="$PR_BASE_SHA"
          elif [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$PUSH_BEFORE_SHA"
          else
            BASE_REF="HEAD~1"
          fi
          turbo-lean --json audit-spec Verity/Core/Uint256.lean --decl Verity.Core.Uint256.add_comm
          turbo-lean --json seed-shards --project-dir .
          turbo-lean --json check Verity/Proofs/Stdlib --project-dir .
          turbo-lean --json pr-verify --base "$BASE_REF" --project-dir . --receipt /tmp/verity-ci-receipt.json
          turbo-lean --json verify-receipt /tmp/verity-ci-receipt.json

      # Turbo-Lean materializes dependency Lake recipes offline. Provision the
      # C sources already declared by EVMYulLean at immutable revisions first.
      - name: Prepare EVMYulLean SHA-256 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: amosnier/sha-2
          ref: 565f65009bdd98267361b17d50cddd7c9beb3e6c
          path: .lake/packages/evmyul/sha2
          persist-credentials: false

      - name: Prepare EVMYulLean Keccak source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: brainhub/SHA3IUF
          ref: fc8504750a5c2174a1874094dd05e6a0d8797753
          path: .lake/packages/evmyul/keccak256
          persist-credentials: false

      # Keep the established verifier and its narrow axiom policy. The newer
      # builder supports declarative Lake inputs and audits Lean 4.31 artifacts.
      - name: Checkout input-aware Turbo-Lean builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Th0rgal/turbo-lean
          ref: 265e91ab454435fa9c865b7a416d4770d50f7216
          path: .lake/turbo-input-builder
          persist-credentials: false

      - name: Build isolated input-aware Turbo-Lean
        run: |
          cargo build --release --locked --manifest-path .lake/turbo-input-builder/Cargo.toml

      - name: Install Foundry for bounded memory regressions
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.0

      - name: Verify bounded memory against independent Cancun expectations
        timeout-minutes: 20
        run: |
          python3 scripts/setup_solc_import.py --version 0.8.26 --output .lake/solidity-import/solc-0.8.26
          TURBO_LEAN_HOME="$RUNNER_TEMP/verity-input-build-cas" \
            .lake/turbo-input-builder/target/release/turbo-lean --json build \
            Compiler.SolidityImport.Import Compiler.SolidityImport.Differential --project-dir .
          PYTHONPATH=scripts python3 -m solidity_differential.check_packed_memory_hash_routes --prepared --require-admission --output .lake/bounded-memory/packed
          PYTHONPATH=scripts python3 -m solidity_differential.check_bounded_memory --prepared --output .lake/bounded-memory/constructs
          PYTHONPATH=scripts python3 -m solidity_differential.check_storage_reference --prepared --output .lake/bounded-memory/storage-reference

      - name: Archive bounded memory execution and rejection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bounded-memory-regressions
          path: .lake/bounded-memory/**
          include-hidden-files: true
          retention-days: 14
